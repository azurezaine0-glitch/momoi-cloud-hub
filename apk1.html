<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EasyFun Wrapper</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    touch-action: manipulation;
    background: #000;
  }

  /* IFRAME EASYFUN */
  #wrap {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  iframe#easyfun {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* --- TOMBOL BUKA SIDEBAR --- */
  .toggle-btn {
    position: fixed;
    top: 55%; 
    right: 0;
    transform: translateY(-50%);
    width: 16px; 
    height: 50px;
    background: #ff1e78;
    border-radius: 10px 0 0 10px;
    z-index: 500;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 0.8rem;
    box-shadow: -2px 0 8px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: 0.2s;
    opacity: 0.8;
  }
  .toggle-btn:active { transform: translateY(-50%) scale(0.9); opacity: 1; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 90;
    display: none;
    backdrop-filter: blur(2px);
  }
  .overlay.active { display: block; }

  /* --- SIDEBAR PANEL --- */
  .sidebar {
    position: fixed;
    top: 0;
    right: -320px; 
    width: 320px;
    height: 100%;
    background: rgba(20, 10, 15, 0.98);
    z-index: 100;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: -5px 0 20px rgba(0,0,0,0.8);
    border-left: 3px solid #ff1e78;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    color: white;
  }
  .sidebar.open { right: 0; }
  
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #ff1e78;
    padding-bottom: 10px;
  }

  .sidebar-header h3 {
    color: #ff1e78;
    font-size: 1.1rem;
    letter-spacing: 1px;
  }

  /* Tombol Lock Screen */
  .lock-btn {
    background: rgba(255, 30, 120, 0.2);
    border: 1px solid #ff1e78;
    color: #ff1e78;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  .lock-btn:active { transform: scale(0.9); }

  /* --- JAM & TIMER --- */
  .time-section {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 15px;
    border: 1px solid rgba(255, 30, 120, 0.3);
    text-align: center;
  }
  
  .digital-clock {
    font-size: 2rem;
    font-weight: bold;
    color: #ff1e78;
    font-family: 'Courier New', Courier, monospace;
    text-shadow: 0 0 10px rgba(255, 30, 120, 0.5);
    margin-bottom: 5px;
  }

  .timer-display {
    font-size: 1.5rem;
    font-weight: bold;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    margin: 10px 0;
  }

  .timer-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .timer-btn {
    background: #2a2a35;
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .timer-btn:active { transform: scale(0.9); }
  .timer-btn.active { background: #ff1e78; }

  /* --- MUSIC PLAYER --- */
  .music-section {
    background: rgba(30, 30, 35, 0.9); 
    padding: 20px 15px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  
  .now-playing {
    font-size: 0.95rem;
    color: #e0e0e0;
    text-align: center;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  
  .now-playing span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
  }

  /* Kontrol Tengah */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
  }

  .ctrl-btn {
    background: #2a2a35; 
    border: none;
    color: #fff;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  
  .ctrl-btn:hover { background: #3b3b4a; }
  .ctrl-btn:active { transform: scale(0.85); }

  /* Ikon SVG di dalam tombol */
  .ctrl-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* Tombol Play Tengah */
  .ctrl-btn.play-btn {
    width: 55px;
    height: 55px;
    background: #2a2a35;
  }
  .ctrl-btn.play-btn svg { width: 24px; height: 24px; }

  /* Tombol Loop Aktif */
  .ctrl-btn.active-loop {
    background: #ff1e78;
    color: white;
    box-shadow: 0 0 10px rgba(255, 30, 120, 0.6);
  }

  /* Progress & Volume */
  .progress-container {
    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 10px;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background: #ff1e78;
    border-radius: 5px;
    width: 0%;
  }

  .time-display {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: #888;
    margin-bottom: 15px;
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    padding: 0 5px;
  }
  .volume-slider { 
    flex: 1; 
    accent-color: #ff1e78; 
    height: 4px;
    cursor: pointer;
  }

  /* List Lagu */
  .playlist-list {
    max-height: 140px;
    overflow-y: auto;
    margin-top: 15px;
    font-size: 0.85rem;
    background: transparent;
    border-radius: 10px;
  }
  .playlist-item {
    padding: 12px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 8px;
    transition: 0.2s;
    color: #aaa;
  }
  .playlist-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .playlist-item.active { 
    color: #ff1e78; 
    font-weight: bold; 
    background: rgba(255, 30, 120, 0.1);
  }

  /* --- TOMBOL SEARCH --- */
  .btn-search {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid #555;
    transition: 0.2s;
  }
  .btn-search:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
  .btn-google { border-color: #4285F4; color: #4285F4; }
  .btn-youtube { border-color: #FF0000; color: #FF0000; }

  /* --- JENDELA MELAYANG --- */
  .floating-window {
    position: fixed;
    top: 5%; left: 5%; width: 90%; height: 85%;
    background: #fff; border-radius: 12px;
    z-index: 9999; display: none; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border: 3px solid #ff1e78;
    overflow: hidden;
  }
  .floating-window.active { display: flex; }
  
  .floating-header {
    background: #ff1e78; color: white;
    padding: 12px 15px; display: flex; justify-content: space-between;
    align-items: center; font-weight: bold;
  }
  .btn-close-float {
    background: rgba(0,0,0,0.3); border: none; color: white;
    padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;
  }
  .floating-window iframe { flex: 1; width: 100%; border: none; background: white; }
  
  .float-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 9998; display: none;
  }
  .float-overlay.active { display: block; }

  /* --- FITUR LOCK SCREEN --- */
  .screen-lock {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999; 
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #333;
    touch-action: none;
  }
  .screen-lock.active { display: flex; }
  
  .unlock-btn {
    background: rgba(255, 30, 120, 0.2);
    border: 2px solid #ff1e78;
    color: #ff1e78;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 30, 120, 0.4); }
    70% { box-shadow: 0 0 0 20px rgba(255, 30, 120, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 30, 120, 0); }
  }

</style>
</head>
<body>

  <div id="wrap">
    <iframe
      id="easyfun"
      src="https://www.easyfun.gg/"
      scrolling="no"
      allow="fullscreen; autoplay; encrypted-media; gamepad; clipboard-read; clipboard-write"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <!-- FITUR LOCK SCREEN -->
  <div class="screen-lock" id="screenLock">
    <div style="font-size: 3rem; margin-bottom: 10px;">🔒</div>
    <p style="color: #666; font-size: 0.9rem;">Layar Terkunci (Anti-Scroll)</p>
    <button class="unlock-btn" onclick="toggleLock()">Buka Kunci</button>
  </div>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">‹</div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>🎧 EasyFun Tools</h3>
      <button class="lock-btn" onclick="toggleLock()">🔒 Kunci</button>
    </div>

    <!-- JAM & TIMER -->
    <div class="time-section">
      <div class="digital-clock" id="clock">00:00:00</div>
      
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-controls">
        <button class="timer-btn" id="startTimerBtn" onclick="startTimer()">Mulai</button>
        <button class="timer-btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- MUSIC PLAYER -->
    <div class="music-section">
      <div class="now-playing">
        <span>🎵</span> <span id="nowPlaying">Pilih Lagu...</span>
      </div>
      
      <audio id="audioPlayer"></audio>
      
      <!-- Kontrol Tengah -->
      <div class="controls">
        <!-- Tombol Loop -->
        <button class="ctrl-btn" onclick="toggleLoop()" id="loopBtn" title="Ulang Terus Menerus">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        
        <button class="ctrl-btn" onclick="prevSong()">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        
        <!-- Tombol Play/Stop (Ikon SVG) -->
        <button class="ctrl-btn play-btn" onclick="togglePlay()" id="playBtn">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        
        <button class="ctrl-btn" onclick="nextSong()">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Progress -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>

      <!-- Volume -->
      <div class="volume-container">
        <span>🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
      </div>

      <!-- Playlist -->
      <div class="playlist-list" id="playlistList"></div>
    </div>

    <button class="btn-search btn-google" onclick="openSearch('google')">🌐 Cari di Google</button>
    <button class="btn-search btn-youtube" onclick="openSearch('youtube')">▶ Buka YouTube</button>
  </div>

  <div class="float-overlay" id="floatOverlay" onclick="closeAllFloats()"></div>

  <div class="floating-window" id="searchWindow">
    <div class="floating-header">
      <span id="searchTitle">Pencarian</span>
      <button class="btn-close-float" onclick="closeAllFloats()">✖ Tutup</button>
    </div>
    <iframe id="searchFrame" src=""></iframe>
  </div>

<script>
  // =========================================
  // LOGIKA BUKA/TUTUP SIDEBAR
  // =========================================
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const toggleBtn = document.getElementById('toggleBtn');

  function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
    if (sidebar.classList.contains('open')) {
      toggleBtn.innerHTML = '›';
    } else {
      toggleBtn.innerHTML = '‹';
    }
  }

  // =========================================
  // FITUR LOCK SCREEN
  // =========================================
  const screenLock = document.getElementById('screenLock');
  let isLocked = false;

  function toggleLock() {
    isLocked = !isLocked;
    if (isLocked) {
      screenLock.classList.add('active');
      if(sidebar.classList.contains('open')) toggleSidebar();
    } else {
      screenLock.classList.remove('active');
    }
  }

  // =========================================
  // FITUR JAM & TIMER (STOPWATCH)
  // =========================================
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').innerText = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  let timerInterval;
  let timerSeconds = 0;
  let isTimerRunning = false;
  const timerDisplay = document.getElementById('timerDisplay');
  const startTimerBtn = document.getElementById('startTimerBtn');

  function formatTimer(sec) {
    const h = String(Math.floor(sec / 3600)).padStart(2, '0');
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function startTimer() {
    if (isTimerRunning) {
      clearInterval(timerInterval);
      startTimerBtn.innerText = "Lanjut";
      startTimerBtn.classList.remove('active');
    } else {
      isTimerRunning = true;
      startTimerBtn.innerText = "Jeda";
      startTimerBtn.classList.add('active');
      timerInterval = setInterval(() => {
        timerSeconds++;
        timerDisplay.innerText = formatTimer(timerSeconds);
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isTimerRunning = false;
    timerSeconds = 0;
    timerDisplay.innerText = "00:00:00";
    startTimerBtn.innerText = "Mulai";
    startTimerBtn.classList.remove('active');
  }

  // =========================================
  // FITUR MUSIC PLAYER & LOOP (BEBAS POP-UP)
  // =========================================
  const playlist = [
    { title: "?", src: "p1.mp3" },
    { title: "?", src: "p2.mp3" },
    { title: "?", src: "p3.mp3" },
    { title: "Ruu's Melody", src: "p4.mp3" },
    { title: "Cyan su funkan no yell wo", src: "p5.mp3" },
    { title: "?", src: "p6.mp3" },
    { title: "hifumi daisuki", src: "p7.mp3" },
    { title: "brain rot teto cover", src: "p8.mp3" },
    { title: "no music", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" },
    { title: "Hifumi Daisuki", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" },
    { title: "Shooting Stars", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3" },
    { title: "Connected Sky", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3" },
    { title: "Koi is Love", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3" },
    { title: "Glitch Street", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3" },
    { title: "Re Aoharu", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" }
  ];

  let currentSongIndex = 0;
  let isPlaying = false;
  let isLooping = false; 
  const audioPlayer = document.getElementById('audioPlayer');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const loopBtn = document.getElementById('loopBtn');
  const nowPlaying = document.getElementById('nowPlaying');
  const progressBar = document.getElementById('progressBar');
  const volumeSlider = document.getElementById('volumeSlider');
  const playlistList = document.getElementById('playlistList');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');

  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function renderPlaylist() {
    playlistList.innerHTML = '';
    playlist.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = 'playlist-item' + (index === currentSongIndex ? ' active' : '');
      div.innerHTML = `<span>🎵</span> <span>${song.title}</span>`;
      div.onclick = () => {
        currentSongIndex = index;
        loadSong();
        playSong();
      };
      playlistList.appendChild(div);
    });
  }

  function loadSong() {
    audioPlayer.src = playlist[currentSongIndex].src;
    nowPlaying.innerText = playlist[currentSongIndex].title;
    renderPlaylist();
    const activeItem = playlistList.querySelector('.active');
    if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Fungsi Play (TANPA ALERT)
  function playSong() {
    audioPlayer.play().then(() => {
      isPlaying = true;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    }).catch(e => {
      // Pop-up alert udah dihapus
      console.log("Gagal play (browser ngeblokir autoplay): ", e);
    });
  }

  function togglePlay() {
    if (isPlaying) {
      audioPlayer.pause();
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    } else {
      playSong();
    }
  }

  function toggleLoop() {
    isLooping = !isLooping;
    if (isLooping) {
      loopBtn.classList.add('active-loop');
    } else {
      loopBtn.classList.remove('active-loop');
    }
  }

  function nextSong() {
    currentSongIndex = (currentSongIndex + 1) % playlist.length;
    loadSong();
    playSong();
  }

  function prevSong() {
    currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
    loadSong();
    playSong();
  }

  audioPlayer.addEventListener('timeupdate', () => {
    if (audioPlayer.duration) {
      const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      progressBar.style.width = percent + '%';
      currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
      durationTimeEl.innerText = formatTime(audioPlayer.duration);
    }
  });

  document.getElementById('progressContainer').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audioPlayer.currentTime = percent * audioPlayer.duration;
  });

  audioPlayer.addEventListener('ended', () => {
    if (isLooping) {
      audioPlayer.currentTime = 0;
      playSong();
    } else {
      nextSong();
    }
  });

  volumeSlider.addEventListener('input', (e) => { audioPlayer.volume = e.target.value; });
  audioPlayer.volume = 0.5;
  loadSong();

  // =========================================
  // FITUR JENDELA MELAYANG (GOOGLE & YOUTUBE)
  // =========================================
  const searchWindow = document.getElementById('searchWindow');
  const searchFrame = document.getElementById('searchFrame');
  const floatOverlay = document.getElementById('floatOverlay');
  const searchTitle = document.getElementById('searchTitle');

  function openSearch(type) {
    if (type === 'google') {
      searchTitle.innerText = "🌐 Google";
      searchFrame.src = "https://www.google.com/search?igu=1"; 
    } else if (type === 'youtube') {
      searchTitle.innerText = "▶ YouTube (Buka di Chrome Jika Blank)";
      searchFrame.src = "https://m.youtube.com/"; 
    }
    searchWindow.classList.add('active');
    floatOverlay.classList.add('active');
    if(sidebar.classList.contains('open')) toggleSidebar();
  }

  function closeAllFloats() {
    searchWindow.classList.remove('active');
    floatOverlay.classList.remove('active');
    searchFrame.src = ""; 
  }

  // =========================================
  // SCROLL & GESTURE LOCK (KODE ASLI)
  // =========================================
  function lockScroll() {
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    window.scrollTo(0, 0);
  }
  lockScroll();

  const wrap = document.getElementById('wrap');
  wrap.addEventListener('touchmove', function(e) {
    if (e.target === wrap) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  }, { passive: false });

  let lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  document.addEventListener('click', function once() {
    goFullscreen();
    document.removeEventListener('click', once);
  });

  window.addEventListener('resize', function () {
    window.scrollTo(0, 0);
  });
  window.addEventListener('scroll', function () {
    window.scrollTo(0, 0);
  });

</script>
</body>
</html>
